name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.13.1'
          enable-cache: true
      - uses: go-task/setup-task@0ab1b2a65bc55236a3bc64cde78f80e20e8885c2 # v1.0.0
        with:
          version: '3.51.1'
      - name: Install actionlint and Gitleaks
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
        env:
          UV_LINK_MODE: copy
      - name: Require the system C++ compiler
        run: c++ --version
      - run: task lint typecheck unit vectors bootstrap source-only secrets privacy

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        esphome: ['2026.10.0']
    env:
      ESPHOME_VERSION: ${{ matrix.esphome }}
      ESPHOME_IDF_DEFAULT_TOOLS_FORCE: 'required;cmake'
    # The stock Voice PE package fetches voice_kit from dev before the local pin.
    # GitHub and raw.githubusercontent.com access must stay enabled.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Select external build root
        run: echo "ESPHOME_WORK_DIR=$RUNNER_TEMP/esphome-$ESPHOME_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: '0.13.1'
          enable-cache: true
      - uses: go-task/setup-task@0ab1b2a65bc55236a3bc64cde78f80e20e8885c2 # v1.0.0
        with:
          version: '3.51.1'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            ~/.espressif
            ${{ runner.temp }}/esphome-${{ matrix.esphome }}/data
          key: firmware-${{ runner.os }}-esphome-${{ matrix.esphome }}-${{ hashFiles('uv.lock', 'tests/fixtures/*.yaml') }}
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
        env:
          UV_LINK_MODE: copy
      - name: Check ESPHome and managed CMake
        env:
          EXPECTED: ${{ matrix.esphome }}
        run: |
          test "$(uv run --locked esphome version)" = "Version: $EXPECTED"
          uv run --locked python tools/check_release.py --toolchain
      - name: Compile UDP and WebSocket timing variants
        run: task config compile
      - run: task compile-probe secrets

  ci-complete:
    runs-on: ubuntu-latest
    needs: [checks, compile]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          needs = json.loads(os.environ['NEEDS'])
          failed = [name for name, job in needs.items() if job['result'] != 'success']
          if failed:
              print('FAIL ci-complete: ' + ', '.join(failed))
              sys.exit(1)
          print('PASS ci-complete')
          PY
