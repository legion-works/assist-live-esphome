# Compile only. Do not flash this fixture.
substitutions:
  test_device: assist-live-compile-test
  assist_live_device_token: !secret assist_live_device_token
  assist_live_server: !secret assist_live_server
  voice_pe_sounds: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds
  jack_connected_sound_file: ${voice_pe_sounds}/jack_connected.flac
  jack_disconnected_sound_file: ${voice_pe_sounds}/jack_disconnected.flac
  mute_switch_on_sound_file: ${voice_pe_sounds}/mute_switch_on.flac
  mute_switch_off_sound_file: ${voice_pe_sounds}/mute_switch_off.flac
  timer_finished_sound_file: ${voice_pe_sounds}/timer_finished.flac
  wake_word_triggered_sound_file: ${voice_pe_sounds}/wake_word_triggered.flac
  center_button_press_sound_file: ${voice_pe_sounds}/center_button_press.flac
  center_button_double_press_sound_file: ${voice_pe_sounds}/center_button_double_press.flac
  center_button_triple_press_sound_file: ${voice_pe_sounds}/center_button_triple_press.flac
  center_button_long_press_sound_file: ${voice_pe_sounds}/center_button_long_press.flac
  factory_reset_initiated_sound_file: ${voice_pe_sounds}/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: ${voice_pe_sounds}/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: ${voice_pe_sounds}/factory_reset_confirmed.mp3
  easter_egg_tick_sound_file: ${voice_pe_sounds}/easter_egg_tick.mp3
  easter_egg_tada_sound_file: ${voice_pe_sounds}/easter_egg_tada.mp3
  error_cloud_expired_sound_file: ${voice_pe_sounds}/error_cloud_expired.mp3

packages:
  voice_pe:
    url: https://github.com/esphome/home-assistant-voice-pe
    ref: 2644f4c794271d735d182ca7ebf899ed46164f4e
    files: [home-assistant-voice.yaml]
    refresh: never

esphome:
  name: ${test_device}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# The last source pins voice_kit after the package's upstream dev source.
external_components:
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: 2644f4c794271d735d182ca7ebf899ed46164f4e
    components: [voice_kit]
    refresh: never
  - source:
      type: local
      path: ../../components
    components: [assist_live]

assist_live:
  id: assist_live_component
