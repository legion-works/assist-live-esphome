# Optional stock Voice PE overlay. Keep the base example without this package.
assist_live:
  pre_roll:
    id: pre_roll_mic
    microphone: i2s_mics
    length_ms: 250
    wake_sound: wake_sound

substitutions:
  assist_live_wake_arm: 'id(pre_roll_mic).wake_detected();'

voice_assistant:
  on_listening:
    - lambda: id(pre_roll_mic).listening();
  on_error:
    - lambda: id(pre_roll_mic).clear();
  on_client_disconnected:
    - lambda: id(pre_roll_mic).clear();

binary_sensor:
  - id: !extend hardware_mute_switch
    on_press:
      - lambda: id(pre_roll_mic).set_privacy_mute(true);
    on_release:
      - lambda: id(pre_roll_mic).set_privacy_mute(false);

switch:
  - id: !extend master_mute_switch
    on_turn_on:
      - lambda: id(pre_roll_mic).set_privacy_mute(true);
    on_turn_off:
      - lambda: id(pre_roll_mic).set_privacy_mute(id(hardware_mute_switch).state);
