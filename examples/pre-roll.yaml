# Optional stock Voice PE overlay. Keep the base example without this package.
assist_live:
  pre_roll:
    id: pre_roll_mic
    microphone: i2s_mics
    length_ms: 250
    wake_sound: wake_sound

micro_wake_word:
  on_wake_word_detected:
    then:
      - assist_live.emit_event:
          id: assist_live_component
          stage: wake_detected
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - voice_assistant.stop:
                      else:
                        - if:
                            condition:
                              media_player.is_announcing:
                                id: external_media_player
                            then:
                              - media_player.stop:
                                  announcement: true
                                  id: external_media_player
                            else:
                              - if:
                                  condition:
                                    switch.is_on: wake_sound
                                  then:
                                    - script.execute:
                                        id: play_sound
                                        priority: true
                                        sound_file: wake_word_triggered_sound
                                    - delay: 300ms
                              - lambda: id(pre_roll_mic).wake_detected();
                              - voice_assistant.start:
                                  wake_word: !lambda return wake_word;

voice_assistant:
  on_listening:
    - lambda: id(pre_roll_mic).listening();
  on_error:
    - lambda: id(pre_roll_mic).clear();
  on_client_disconnected:
    - lambda: id(pre_roll_mic).clear();

binary_sensor:
  - id: !extend hardware_mute_switch
    on_press:
      - lambda: id(pre_roll_mic).set_privacy_mute(true);
    on_release:
      - lambda: id(pre_roll_mic).set_privacy_mute(false);

switch:
  - id: !extend master_mute_switch
    on_turn_on:
      - lambda: id(pre_roll_mic).set_privacy_mute(true);
    on_turn_off:
      - lambda: id(pre_roll_mic).set_privacy_mute(id(hardware_mute_switch).state);
