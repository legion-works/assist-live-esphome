# A list merge puts timing after the stock delay. Replace the handler instead.
substitutions:
  assist_live_reply_window: 'false'
  assist_live_reply_restart: 'false'
  assist_live_wake_arm: 'return;'
  assist_live_wake_started: 'return;'
  assist_live_reply_capture: 'return;'
  assist_live_reply_ready: 'return true;'
  assist_live_reply_cancel: 'return;'

packages:
  reply_window: !include
    file: wake-word-window.yaml
    condition: ${assist_live_reply_window}
  reply_restart: !include
    file: wake-word-restart.yaml
    condition: ${assist_live_reply_restart}

micro_wake_word:
  on_wake_word_detected:
    then: !include wake-word-handler-${assist_live_reply_restart}.yaml
