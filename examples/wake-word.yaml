# A list merge puts timing after the stock delay. Replace the handler instead.
substitutions:
  assist_live_wake_arm: 'return;'

micro_wake_word:
  on_wake_word_detected:
    then:
      - assist_live.emit_event:
          id: assist_live_component
          stage: wake_detected
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - voice_assistant.stop:
                      else:
                        - if:
                            condition:
                              media_player.is_announcing:
                                id: external_media_player
                            then:
                              - media_player.stop:
                                  announcement: true
                                  id: external_media_player
                            else:
                              - if:
                                  condition:
                                    switch.is_on: wake_sound
                                  then:
                                    - script.execute:
                                        id: play_sound
                                        priority: true
                                        sound_file: wake_word_triggered_sound
                                    - delay: 300ms
                              - lambda: ${assist_live_wake_arm}
                              - voice_assistant.start:
                                  wake_word: !lambda return wake_word;
