# A list merge puts timing after the stock delay. Replace the handler instead.
substitutions:
  assist_live_wake_arm: 'return;'
  assist_live_wake_started: 'return;'
  assist_live_reply_capture: 'return;'
  assist_live_reply_ready: 'return true;'
  assist_live_reply_cancel: 'return;'

globals:
  - id: reply_wake_window
    type: assist_live::ReplyWakeWindow
  - id: reply_wake_pending
    type: bool
    initial_value: 'false'
  - id: reply_wake_detected_ms
    type: uint32_t
    initial_value: '0'

select:
  - id: !extend wake_word_sensitivity
    on_value:
      lambda: |-
        static bool attached = false;
        if (!attached) {
          id(external_media_player).add_on_state_callback([](media_player::MediaPlayerState) {
            id(assist_live_update_reply_wake).execute();
          });
          attached = true;
        }
        id(reply_wake_window).select(x);
        id(assist_live_update_reply_wake).execute();

voice_assistant:
  on_error:
    - script.execute: assist_live_cancel_reply_wake
  on_client_disconnected:
    - script.execute: assist_live_cancel_reply_wake
  on_listening:
    - lambda: id(reply_wake_window).listening(millis());
    - script.execute: assist_live_apply_wake_cutoffs

switch:
  - id: !extend master_mute_switch
    on_turn_on:
      - script.execute: assist_live_cancel_reply_wake

script:
  - id: assist_live_cancel_reply_wake
    then:
      - lambda: |-
          if (!id(reply_wake_pending)) return;
          id(reply_wake_pending) = false;
          id(assist_live_restart_reply_wake).stop();
          ESP_LOGI("assist_live.reply_wake", "Reply wake canceled");
          ${assist_live_reply_cancel}
  - id: assist_live_restart_reply_wake
    mode: single
    parameters:
      wake_word: std::string
    then:
      - lambda: |-
          id(reply_wake_pending) = true;
          id(reply_wake_detected_ms) = millis();
          ${assist_live_reply_capture}
      - voice_assistant.stop:
      - wait_until:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: external_media_player
          timeout: 500ms
      - if:
          condition:
            and:
              - lambda: return id(reply_wake_pending);
              - switch.is_off: master_mute_switch
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: external_media_player
              - lambda: ${assist_live_reply_ready}
          then:
            - lambda: |-
                ESP_LOGI("assist_live.reply_wake", "Reply wake detection_to_idle_ms=%u",
                         unsigned(millis() - id(reply_wake_detected_ms)));
            - if:
                condition:
                  switch.is_on: wake_sound
                then:
                  - script.execute:
                      id: play_sound
                      priority: true
                      sound_file: wake_word_triggered_sound
                  - delay: 300ms
            - if:
                condition:
                  and:
                    - lambda: return id(reply_wake_pending);
                    - switch.is_off: master_mute_switch
                    - not:
                        voice_assistant.is_running:
                    - lambda: ${assist_live_reply_ready}
                then:
                  - lambda: |-
                      ESP_LOGI("assist_live.reply_wake", "Reply wake detection_to_start_ms=%u",
                               unsigned(millis() - id(reply_wake_detected_ms)));
                  - lambda: ${assist_live_wake_arm}
                  - voice_assistant.start:
                      wake_word: !lambda return wake_word;
                  - lambda: ${assist_live_wake_started}
                  - lambda: id(reply_wake_pending) = false;
                else:
                  - script.execute: assist_live_cancel_reply_wake
          else:
            - lambda: ESP_LOGW("assist_live.reply_wake", "Reply wake idle wait expired or start blocked");
            - script.execute: assist_live_cancel_reply_wake
  - id: assist_live_apply_wake_cutoffs
    then:
      - lambda: |-
          if (!id(reply_wake_window).take_change()) return;
          const auto cutoffs = id(reply_wake_window).cutoffs();
          const auto *reason = id(reply_wake_window).reason();
          id(okay_nabu).set_probability_cutoff(cutoffs[0]);
          ESP_LOGI("assist_live.reply_wake", "okay_nabu reason=%s cutoff=%u", reason, unsigned(cutoffs[0]));
          id(hey_jarvis).set_probability_cutoff(cutoffs[1]);
          ESP_LOGI("assist_live.reply_wake", "hey_jarvis reason=%s cutoff=%u", reason, unsigned(cutoffs[1]));
          id(hey_mycroft).set_probability_cutoff(cutoffs[2]);
          ESP_LOGI("assist_live.reply_wake", "hey_mycroft reason=%s cutoff=%u", reason, unsigned(cutoffs[2]));
  - id: assist_live_update_reply_wake
    then:
      - lambda: |-
          const bool was_announcing = id(reply_wake_window).announcing();
          const bool started = id(reply_wake_window).observe(millis(),
              id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING,
              id(va).is_running());
          id(assist_live_apply_wake_cutoffs).execute();
          if (started) id(assist_live_reply_wake_tail).stop();
          else if (was_announcing && !id(reply_wake_window).announcing())
            id(assist_live_reply_wake_tail).execute();
  - id: assist_live_reply_wake_tail
    mode: restart
    then:
      # VA on_idle fires only in continuous mode. Wait only after playback ends.
      - wait_until:
          condition:
            lambda: |-
              return id(external_media_player).state != media_player::MEDIA_PLAYER_STATE_ANNOUNCING
                  && (!id(va).is_running() || id(reply_wake_window).listening_turn());
          timeout: 30s
      - lambda: |-
          if (id(va).is_running() && !id(reply_wake_window).listening_turn()) {
            ESP_LOGW("assist_live.reply_wake", "VA idle wait expired; restore selected cutoffs");
            id(reply_wake_window).expire_wait();
            id(assist_live_apply_wake_cutoffs).execute();
          } else {
            id(reply_wake_window).observe(millis(), false, false);
          }
      - delay: !lambda return assist_live::ReplyWakeWindow::REPLY_TAIL_MS;
      - lambda: |-
          id(reply_wake_window).observe(millis(),
              id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING,
              id(va).is_running());
      - script.execute: assist_live_apply_wake_cutoffs

micro_wake_word:
  on_wake_word_detected:
    then:
      - assist_live.emit_event:
          id: assist_live_component
          stage: wake_detected
      - if:
          condition:
            lambda: return id(reply_wake_pending) && wake_word == "Stop";
          then:
            - script.execute: assist_live_cancel_reply_wake
      - if:
          condition:
            and:
              - lambda: return !id(reply_wake_pending);
              - switch.is_off: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return wake_word != "Stop"
                                    && id(voice_assistant_phase) == ${voice_assist_replying_phase_id}
                                    && id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
                            then:
                              - script.execute:
                                  id: assist_live_restart_reply_wake
                                  wake_word: !lambda return wake_word;
                            else:
                              - voice_assistant.stop:
                      else:
                        - if:
                            condition:
                              media_player.is_announcing:
                                id: external_media_player
                            then:
                              - media_player.stop:
                                  announcement: true
                                  id: external_media_player
                            else:
                              - if:
                                  condition:
                                    switch.is_on: wake_sound
                                  then:
                                    - script.execute:
                                        id: play_sound
                                        priority: true
                                        sound_file: wake_word_triggered_sound
                                    - delay: 300ms
                              - lambda: ${assist_live_wake_arm}
                              - voice_assistant.start:
                                  wake_word: !lambda return wake_word;
                              - lambda: ${assist_live_wake_started}
